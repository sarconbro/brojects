<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Home Solutions</title>
  </head>

  <body>
    <main>
      <div class="logo">
        <img src="homes.svg" alt="House Image" />
        <h1 id="homesolutions">Home Solutions</h1>
      </div>

      <div class="login">
        <h2>Log In</h2>
        <input id="email" type="email" placeholder="e-mail" />
        <input id="password" type="password" placeholder="password" />
        <button type="button">Log In</button>
        <div id="register">
          Don't have an account? <a href="https://google.com">Register</a>
        </div>
      </div>
    </main>
  </body>
</html>
